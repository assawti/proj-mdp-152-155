# create_cluster.yml
- name: Create Kubernetes Cluster
  hosts: localhost
  become: no
  vars:
    cluster_name: "mycluster.k8s.local"
    kops_state_store: "s3://my-kops-state-store"
    zones: "us-east-1a,us-east-1b"
    node_count: 2
    node_size: "t3.medium"
    master_size: "t3.medium"
  tasks:
    - name: Create Kubernetes cluster with KOPS
      shell: |
        export KOPS_STATE_STORE={{ kops_state_store }}
        kops create cluster \
          --name={{ cluster_name }} \
          --zones={{ zones }} \
          --node-count={{ node_count }} \
          --node-size={{ node_size }} \
          --master-size={{ master_size }} \
          --yes
      environment:
        KOPS_STATE_STORE: "{{ kops_state_store }}"

